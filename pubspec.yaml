name: green_eye
description: Real-time plant disease classifier for SDG.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  tflite_v2: ^1.0.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
  - assets/models/plant_model.tflite
  - assets/models/labels.txt
  - assets/images/diseases/